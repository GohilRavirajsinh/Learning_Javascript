<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React</title>
</head>

<body>
    <button>Button Clicked</button>
</body>

<script>
    class React {
        constructor(){
            this.library = "React"
            this.server = "http://localhost:300"

        // Requirement
        // using bind to ensure 'this' inside handleClick refers to the class instance, not the button.
        document
        .querySelector('button')
        .addEventListener('click', this.handleClick().bind(this)) // bind this call direct class
        // .bind(this) returns a new function with 'this' set to the React class instance.
        }
        handleClick(){
            console.log('button Clicked')
            console.log(this.server)
            console.log(this)
        }
    }
    const app = new React()
</script>
</html>
