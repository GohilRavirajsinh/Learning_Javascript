</body>

    // addEventListener
    document.getElementById('bmw').addEventListener('click', function(e) {
        alert('Wait and See')
        console.log(e) // for checking console properties in browser
    }, false) // it default false, it runs like child, #EventBubbling
    // True: is agianst of false, it runs like parent, #EventCapturing

    // Learning of EVENTS into AddEventListeners
    // type, //timestamp, defaultPrevented(default behaviour change/or stay :- like anchor tag navigation stop,etc..),
    // target, toElement, SrcElement, currentTarget,
    // clientX, clientY, screenX, screenY
    // altkey, ctrlkey, shiftkey, keyCode

    document.getElementById('images').addEventListener('click', function (e){
        // console.log("Parent UL Clicked");
    }, false) // Jiska true hoga uska pehle print hoga baki by default false rehta hai to agar dono false rahega to pehle jo click kiya vo print hoga uske bad dusra hoga like agar parent ke ander child hai or dono ka false hai or vo child ke uper print krenge to pehle child vala print hoga uske bad vo parent vala print hoga! dono true hoga to parent first hoga.
    document.getElementById('peace').addEventListener('click', function (e){
        console.log("Child LI Clicked");
    // stopPropogation()
        e.stopPropagation(); // ye parent ko call nhin karta also baki ka sab stop krta hai or jo iske function me hoga bas usi ko call krta hai
    }, true)

    // preventDefault() Use on Google Link
    document.getElementById('google').addEventListener('click',function (e) {
        e.preventDefault(); // stop using clicked to link and open 
        console.log('Google Clicked') // clicked in browser
        e.stopPropagation(); // stop printing Parent (UL)
    }, false)

        // console.log(e.target.parentNode); // it select parentNode, hmare case me li
        let removeIt = e.target.parentNode
        // removeIt.remove() // it removed images to clicked but the problem is if click on any ul or body so that removed also so in that case using #STRICKTCHECK (.tagname) Method

        console.log(e.target.tagName) // tagname is show tagname, using tag name and Target specific value using IF
        if (e.target.tagName === 'IMG') {
            console.log(e.target.id)
            removeIt.remove()
        }
    }, false)
